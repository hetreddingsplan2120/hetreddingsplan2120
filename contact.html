<html lang="nl">
<head>

<body>

<div class="navbar">
    <a href="index.html">Home</a>

    <a href="contact.html">Contact</a>
    <a href="updates.html">Nieuws & Updates</a>

    <form class="search-bar" onsubmit="siteSearch(event)">
        <input type="search" id="searchInput" placeholder="Zoeken..." />
        <button type="submit">🔍</button>
    </form>
</div>

<main>
    <div id="searchResults"></div>

    <p><i>Dit is de contact pagina</i></p>

    <div class="form">
        <form action="mailto:709@cbsdespringplank.nl,meowdev44@gmail.com"
              method="POST"
              enctype="text/plain">

            <label>Naam:</label><br>
            <input type="text" name="Naam" required><br><br>

            <label>Email:</label><br>
            <input type="email" name="Email" required><br><br>

            <label>Bericht:</label><br>
            <textarea name="Bericht" rows="5" required></textarea><br><br>

            <button type="submit">Versturen</button>
        </form>
    </div>

    <img src="/plaatjes/Aan deze pagina word nog gewerkt.png"
         alt="nog even geduld" width="400" height="500">

    <p><i>Nog even geduld…</i></p>
</main>

<script>
const pages = [
  { title: "Home", url: "index.html", content: "home nederland 2120 klimaat toekomst" },
  { title: "Info", url: "info.html", content: "informatie klimaat water landgebruik" },
  { title: "Ons plan", url: "ons-plan.html", content: "ons plan oplossingen toekomst" },
  { title: "Het verslag", url: "verslag.html", content: "verslag onderzoek klimaat" },
  { title: "Bronnen", url: "bronnen.html", content: "bronnen wur fnv wikipedia" },
  { title: "Nieuws", url: "updates.html", content: "nieuws updates" },
  { title: "Contact", url: "contact.html", content: "contact email bericht" }
];

function siteSearch(event) {
  event.preventDefault();

  const query = document.getElementById("searchInput").value.toLowerCase();
  const resultsDiv = document.getElementById("searchResults");
  resultsDiv.innerHTML = "";

  if (query.length === 0) return;

  const results = pages.filter(page =>
    page.title.toLowerCase().includes(query) ||
    page.content.toLowerCase().includes(query)
  );

  if (results.length === 0) {
    resultsDiv.innerHTML = "<p>Geen resultaten gevonden.</p>";
    return;
  }

  const ul = document.createElement("ul");

  results.forEach(result => {
    const li = document.createElement("li");
    li.innerHTML = `<a href="${result.url}">${result.title}</a>`;
    ul.appendChild(li);
  });

  resultsDiv.appendChild(ul);
}
</script>

</body>
</html>
